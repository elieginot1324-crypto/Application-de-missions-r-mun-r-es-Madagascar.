<!DOCTYPE html>
<html lang="mg"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fanamarinana antontan-taratasy - MADAGASCAR EARN</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#18352b;font:15px Arial,sans-serif}header{background:#07583d;color:white;padding:18px}main{max-width:1050px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #dfebe3;border-radius:14px;padding:18px;margin-bottom:14px}h1{font-size:21px;margin:0}h2{font-size:18px;color:#087c54}p{line-height:1.5;color:#60736a}button{padding:10px 14px;border:0;border-radius:8px;background:#087c54;color:white;font-weight:bold;margin:8px 6px 0 0}button.reject{background:#a63a35}input{padding:10px;border:1px solid #cbd9d0;border-radius:8px;width:100%;max-width:600px}a{color:inherit}.status{padding:12px}</style></head><body><header><h1>MADAGASCAR EARN — Fanamarinana antontan-taratasy</h1><p style="color:white"><a href="/admin.html">Hiverina amin'ny fitantanana</a></p></header><main><section class="card"><h2>Antontan-taratasy miandry</h2><div id="status" class="status">Eo am-pakana...</div><div id="list"></div></section></main><script>
const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const types={cv:"CV",diploma:"Diplaoma",certificate:"Mari-pahaizana",portfolio:"Portfolio"};
async function load(){try{const r=await fetch("/api/admin/qualifications",{credentials:"same-origin",cache:"no-store"});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||"Tsy afaka naka.");$("status").textContent=d.documents.length+" antontan-taratasy miandry."; $("list").innerHTML=d.documents.length?d.documents.map(x=>'<article class="card"><h2>'+esc(x.full_name)+' — '+esc(types[x.document_type]||x.document_type)+'</h2><p>'+esc(x.email||x.phone||"")+' · '+esc(x.file_name)+' · '+Math.ceil(x.file_size/1024)+' Ko</p><p><a target="_blank" rel="noopener" href="/api/admin/qualification-file?id='+Number(x.id)+'">Hijery ilay rakitra</a></p><input id="note-'+Number(x.id)+'" maxlength="1000" placeholder="Antony raha lavina; fanamarihana raha ilaina"><br><button onclick="review('+Number(x.id)+',\'approved\')">Ekena</button><button class="reject" onclick="review('+Number(x.id)+',\'rejected\')">Lavina</button></article>').join(""):"<p>Tsy misy antontan-taratasy miandry.</p>";}catch(e){$("status").textContent=e.message;}}
async function review(id,decision){const note=$("note-"+id).value.trim();if(decision==="rejected"&&note.length<5){alert("Lazao ny antony handavana.");return;}if(!confirm(decision==="approved"?"Hankatoavina ve ity antontan-taratasy ity?":"Lavina ve ity antontan-taratasy ity?"))return;try{const r=await fetch("/api/admin/qualifications",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({document_id:id,decision,note})});const d=await r.json();alert(d.message||"Vita.");if(r.ok&&d.success)load();}catch(e){alert("Tsy afaka mifandray amin'ny mpizara.");}}
load();
</script></body></html>
